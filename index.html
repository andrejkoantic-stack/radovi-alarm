
<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radovi Alarm 500m</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "TVOJ_ONESIGNAL_APP_ID"
      });
    });
  </script>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .card { background: #1e293b; padding: 16px; border-radius: 12px; margin-bottom: 14px; }
    .alarm { border-left: 4px solid #ef4444; }
    a { color: #38bdf8; text-decoration: none; }
    small { color: #94a3b8; }
    button { background: #2563eb; color: #fff; border: none; padding: 12px 16px; border-radius: 8px; font-size: 15px; width: 100%; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h2>🚧 Radovi u krugu 500 m</h2>
  <button onclick="OneSignalDeferred.push(os => os.Notifications.requestPermission())">🔔 Uključi push obavijesti</button>
  <div id="status" class="card">Učitavanje...</div>
  <div id="alarmi"></div>

  <script>
    fetch('data.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        document.getElementById('status').innerHTML = `
          <strong>Adresa:</strong> ${data.adresa}<br>
          <small>Zadnja provjera: ${data.zadnja_provjera} | Praćenih ulica: ${data.broj_ulica}</small>
        `;
        const box = document.getElementById('alarmi');
        if (!data.alarmi.length) {
          box.innerHTML = '<div class="card">✅ Nema zabilježenih radova u blizini.</div>';
          return;
        }
        box.innerHTML = data.alarmi.map(a => `
          <div class="card alarm">
            <strong>${a.naslov}</strong><br>
            <p>${a.opis}</p>
            <small>${a.vrijeme} | <a href="${a.link}" target="_blank">Otvori izvor →</a></small>
          </div>
        `).join('');
      })
      .catch(() => {
        document.getElementById('status').innerText = 'Podaci još nisu generirani. Pokreni GitHub Action.';
      });
  </script>
</body>
</html>
